name: Build iOS 12 IPA

on:
  push:
    branches: [ios12]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install Rust 1.84.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.84.1
          targets: aarch64-apple-ios

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -qry LocalSend-ios12.ipa Payload
          ls -lh LocalSend-ios12.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-ios12
          path: LocalSend-ios12.ipa
          retention-days: 14

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios12-build-${GITHUB_RUN_NUMBER}" LocalSend-ios12.ipa \
            --title "iOS 12 build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned LocalSend 1.17.0 build for iOS 12 (personal use)."
